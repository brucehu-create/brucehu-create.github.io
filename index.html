<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="胡翔高 · 生物信息学 / 多组学 / 单细胞 · 病原生物学硕士，2027 届">
<meta name="robots" content="noindex,nofollow">
<meta property="og:type" content="profile">
<meta property="og:title" content="胡翔高 · Xianggao Hu">
<meta property="og:description" content="生物信息学 / 多组学 / 单细胞 · 病原生物学硕士（2027）">
<meta property="og:image" content="avatar.jpg">
<meta name="theme-color" content="#04050a">
<title>胡翔高 · Xianggao Hu</title>
<style>
/* ============ base ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04050a;
  --tx:#e9edf6;
  --mut:#8b93a8;
  --dim:#5d6478;
  --line:rgba(255,255,255,.09);
  --glass:rgba(255,255,255,.035);
  --glass-2:rgba(255,255,255,.055);
  --c1:#5eead4;
  --c2:#a78bfa;
  --c3:#f472b6;
  --c4:#60a5fa;
  --c5:#fbbf24;
  --max:1080px;
  --r:18px;
}
html[data-theme="light"]{
  --bg:#f6f7fb;
  --tx:#141824;
  --mut:#4c5468;
  --dim:#6f7789;
  --line:rgba(10,20,40,.1);
  --glass:rgba(255,255,255,.72);
  --glass-2:rgba(255,255,255,.92);
  --c1:#0d9488; --c2:#7c3aed; --c3:#db2777; --c4:#2563eb; --c5:#b45309;
}
html[data-theme="light"] .btn.primary{color:#fff}
html[data-theme="light"] .stat b{background-image:linear-gradient(120deg,#0d9488,#2563eb,#7c3aed)}
html[data-theme="light"] .cta h2 .grad{background-image:linear-gradient(100deg,#0d9488,#2563eb,#7c3aed)}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--tx);
  font-family:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
  transition:background .5s ease,color .5s ease;
}
::selection{background:rgba(94,234,212,.28);color:#fff}
a{color:inherit;text-decoration:none}

/* ============ background layers ============ */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85}
.noise{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.028;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.blob{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:0;opacity:.30}
.blob.b1{width:46vw;height:46vw;left:-12vw;top:-14vw;background:radial-gradient(circle,#0ea5e9,transparent 68%);animation:drift1 26s ease-in-out infinite}
.blob.b2{width:40vw;height:40vw;right:-10vw;top:18vh;background:radial-gradient(circle,#a78bfa,transparent 68%);animation:drift2 32s ease-in-out infinite}
.blob.b3{width:38vw;height:38vw;left:26vw;bottom:-18vw;background:radial-gradient(circle,#f472b6,transparent 70%);animation:drift3 38s ease-in-out infinite}
html[data-theme="light"] .blob{opacity:.16}
@keyframes drift1{50%{transform:translate(6vw,5vh) scale(1.12)}}
@keyframes drift2{50%{transform:translate(-5vw,7vh) scale(1.08)}}
@keyframes drift3{50%{transform:translate(4vw,-6vh) scale(1.14)}}

.cursor-glow{
  position:fixed;width:520px;height:520px;left:0;top:0;z-index:1;pointer-events:none;
  border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(94,234,212,.09),rgba(167,139,250,.05) 40%,transparent 68%);
  transition:opacity .4s;opacity:0;
}
@media (hover:hover){.cursor-glow{opacity:1}}

/* ============ chrome ============ */
.progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:120;background:transparent}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c4),var(--c2),var(--c3));box-shadow:0 0 14px rgba(94,234,212,.7)}

.nav{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:110;
  display:flex;align-items:center;gap:6px;
  padding:7px 8px;border-radius:999px;
  border:1px solid var(--line);
  background:rgba(10,12,20,.55);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:0 12px 40px rgba(0,0,0,.35);
  max-width:calc(100vw - 24px);
  width:max-content;
  overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
  transition:opacity .35s,transform .35s;
}
.nav::-webkit-scrollbar{display:none}
.nav>*{flex:none}
html[data-theme="light"] .nav{background:rgba(255,255,255,.72)}
.nav.hide{opacity:0;transform:translateX(-50%) translateY(-14px);pointer-events:none}
.nav a{
  font-size:.82rem;color:var(--mut);padding:7px 13px;border-radius:999px;
  white-space:nowrap;transition:color .25s,background .25s;position:relative;
}
.nav a:hover{color:var(--tx);background:rgba(255,255,255,.06)}
.nav a.on{color:var(--bg);background:linear-gradient(120deg,var(--c1),var(--c4));font-weight:600}
html[data-theme="light"] .nav a.on{color:#fff}
.nav a.nav-alt{color:var(--c2);border-left:1px solid var(--line);border-radius:0 999px 999px 0}
.nav a.nav-alt:hover{color:var(--c2);background:rgba(167,139,250,.12)}
.nav .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.nav button{
  font:inherit;font-size:.8rem;color:var(--mut);background:transparent;border:0;cursor:pointer;
  padding:7px 11px;border-radius:999px;transition:.25s;display:flex;align-items:center;gap:6px;
}
.nav button:hover{color:var(--tx);background:rgba(255,255,255,.06)}
.nav .lang{font-family:ui-monospace,Consolas,monospace;letter-spacing:.06em}
.nav .lang b{color:var(--c1);font-weight:700}

@media (max-width:720px){
  .nav{top:10px;padding:5px;gap:2px}
  .nav a:not(.nav-alt){display:none}
  .nav a.nav-alt{font-size:.74rem;padding:6px 9px;border-left:0}
  .nav .sep{display:none}
  .nav .print-label{display:none}
}
@media (max-width:560px){
  .kicker{letter-spacing:.16em;font-size:.64rem;line-height:1.7;align-items:flex-start}
  .kicker::before{margin-top:.55em}
}

/* ============ layout ============ */
main,footer{position:relative;z-index:2}
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 28px}
section{padding:76px 0;position:relative;scroll-margin-top:88px}

/* ============ hero ============ */
.hero{
  min-height:100svh;display:flex;align-items:center;padding:120px 0 70px;
  position:relative;z-index:2;
}
.hero .wrap{display:grid;grid-template-columns:1.35fr .65fr;gap:56px;align-items:center}
.kicker{
  font-family:ui-monospace,Consolas,monospace;font-size:.74rem;letter-spacing:.34em;
  color:var(--c1);text-transform:uppercase;display:flex;align-items:center;gap:12px;
}
.kicker::before{content:"";width:34px;height:1px;background:linear-gradient(90deg,var(--c1),transparent)}
.hero h1{
  font-size:clamp(3.1rem,7.6vw,5.6rem);
  line-height:1.02;letter-spacing:-.02em;font-weight:800;margin:16px 0 8px;
}
.hero h1 .grad{
  background:linear-gradient(100deg,#fff 0%,var(--c1) 28%,var(--c4) 52%,var(--c2) 74%,var(--c3) 96%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 9s linear infinite;
}
@keyframes shimmer{to{background-position:-220% 0}}
html[data-theme="light"] #bg{opacity:.32}
html[data-theme="light"] .hero h1 .grad{
  background-image:linear-gradient(100deg,#0f172a 0%,#0d9488 30%,#2563eb 54%,#7c3aed 76%,#db2777 100%);
  background-size:220% 100%;
}
.hero .pinyin{
  font-family:ui-monospace,Consolas,monospace;font-size:.8rem;letter-spacing:.42em;
  color:var(--dim);text-transform:uppercase;margin-bottom:22px;
}
.typing{
  font-size:clamp(1.02rem,1.9vw,1.28rem);color:var(--mut);min-height:1.9em;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.typing .cur{display:inline-block;width:2px;height:1.05em;background:var(--c1);animation:blink 1.05s steps(1) infinite;box-shadow:0 0 10px var(--c1)}
@keyframes blink{50%{opacity:0}}
.hero-pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 15px;border-radius:999px;font-size:.83rem;color:var(--mut);
  border:1px solid var(--line);background:var(--glass);
  transition:.3s;backdrop-filter:blur(8px);
}
.pill:hover{color:var(--tx);border-color:rgba(94,234,212,.45);transform:translateY(-2px);box-shadow:0 8px 26px rgba(94,234,212,.12)}
.pill svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none;opacity:.85}
.pill.accent{border-color:rgba(94,234,212,.32);color:var(--c1);background:rgba(94,234,212,.06)}

.hero-actions{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:9px;padding:12px 22px;border-radius:999px;
  font-size:.88rem;font-weight:600;cursor:pointer;border:1px solid transparent;
  transition:transform .25s,box-shadow .25s,background .25s;
}
.btn.primary{
  background:linear-gradient(120deg,var(--c1),var(--c4) 55%,var(--c2));color:#04121a;
  box-shadow:0 10px 34px rgba(94,234,212,.25);
}
.btn.primary:hover{transform:translateY(-3px);box-shadow:0 16px 46px rgba(94,234,212,.36)}
.btn.ghost{border-color:var(--line);background:var(--glass);color:var(--tx)}
.btn.ghost:hover{transform:translateY(-3px);border-color:rgba(167,139,250,.5);box-shadow:0 12px 34px rgba(167,139,250,.16)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}

/* avatar */
.avatar-wrap{position:relative;justify-self:center;width:min(300px,64vw);aspect-ratio:1;animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}
.avatar-ring{
  position:absolute;inset:-14px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--c1),var(--c4),var(--c2),var(--c3),var(--c5),var(--c1));
  animation:spin 11s linear infinite;
  filter:blur(.4px);opacity:.9;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));
}
@keyframes spin{to{transform:rotate(1turn)}}
.avatar-wrap::after{
  content:"";position:absolute;inset:6px;border-radius:50%;
  box-shadow:0 0 70px rgba(94,234,212,.22),0 0 130px rgba(167,139,250,.16);
  pointer-events:none;
}
.avatar-wrap img{
  position:relative;width:100%;height:100%;object-fit:cover;border-radius:50%;
  border:6px solid var(--bg);z-index:1;
  filter:saturate(1.03) contrast(1.02);
}
.orb{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen}
.orb.o1{width:11px;height:11px;background:var(--c1);box-shadow:0 0 22px var(--c1);top:6%;right:6%;animation:orbit1 9s ease-in-out infinite}
.orb.o2{width:8px;height:8px;background:var(--c3);box-shadow:0 0 20px var(--c3);bottom:9%;left:2%;animation:orbit2 12s ease-in-out infinite}
@keyframes orbit1{50%{transform:translate(-22px,26px) scale(.7);opacity:.5}}
@keyframes orbit2{50%{transform:translate(20px,-22px) scale(1.3);opacity:.6}}

.scroll-hint{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:7px;
  font-family:ui-monospace,monospace;font-size:.62rem;letter-spacing:.3em;color:var(--dim);
}
.scroll-hint i{display:block;width:1px;height:34px;background:linear-gradient(var(--c1),transparent);position:relative;overflow:hidden}
.scroll-hint i::after{content:"";position:absolute;top:-34px;left:0;width:1px;height:34px;background:var(--c1);animation:trace 2s cubic-bezier(.6,.1,.4,.9) infinite}
@keyframes trace{to{top:34px}}

/* ============ section head ============ */
.sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:34px}
.sec-num{font-family:ui-monospace,Consolas,monospace;font-size:.76rem;letter-spacing:.24em;color:var(--c1);opacity:.9}
.sec-title{font-size:clamp(1.4rem,2.6vw,1.85rem);font-weight:750;letter-spacing:.01em;white-space:nowrap}
.sec-line{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);transform:translateY(-6px)}
.sec-sub{font-size:.84rem;color:var(--dim);font-weight:400;letter-spacing:.02em}

/* ============ cards ============ */
.card{
  position:relative;border:1px solid var(--line);border-radius:var(--r);
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:26px 28px;transition:transform .4s cubic-bezier(.2,.7,.2,1),border-color .4s,box-shadow .4s,background .4s;
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;transition:opacity .45s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(94,234,212,.10),transparent 62%);
  pointer-events:none;
}
.card:hover{transform:translateY(-5px);border-color:rgba(94,234,212,.28);box-shadow:0 22px 60px rgba(0,0,0,.34);background:var(--glass-2)}
.card:hover::before{opacity:1}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

/* ============ stats ============ */
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:var(--line);margin-top:-6px;
}
.stat{background:rgba(6,8,14,.6);padding:26px 18px;text-align:center;transition:background .35s;position:relative}
html[data-theme="light"] .stat{background:rgba(255,255,255,.7)}
.stat:hover{background:rgba(94,234,212,.06)}
.stat b{
  display:block;font-size:clamp(1.9rem,4vw,2.6rem);font-weight:800;line-height:1.1;
  font-family:ui-monospace,Consolas,monospace;
  background:linear-gradient(120deg,var(--c1),var(--c4),var(--c2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.stat span{display:block;font-size:.76rem;color:var(--mut);margin-top:7px;letter-spacing:.04em}

/* ============ education ============ */
.edu{display:flex;flex-direction:column;gap:4px}
.edu .row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
.edu .school{font-size:1.12rem;font-weight:700;letter-spacing:.01em}
.edu .period{font-family:ui-monospace,Consolas,monospace;font-size:.78rem;color:var(--c1);letter-spacing:.04em;white-space:nowrap}
.edu .major{font-size:.92rem;color:var(--mut);margin-top:6px}
.edu .deg{
  display:inline-block;margin-top:14px;font-size:.74rem;padding:4px 12px;border-radius:999px;
  border:1px solid rgba(167,139,250,.3);color:var(--c2);background:rgba(167,139,250,.07);letter-spacing:.04em;
}
.edu .note{font-size:.78rem;color:var(--dim);margin-top:12px}

/* ============ highlights ============ */
.hl{display:flex;flex-direction:column;gap:16px;height:100%}
.hl .idx{
  font-family:ui-monospace,Consolas,monospace;font-size:.72rem;letter-spacing:.22em;
  color:var(--c1);opacity:.9;
}
.hl h3{font-size:1.02rem;font-weight:700;margin:10px 0 12px}
.hl p{font-size:.88rem;color:var(--mut);line-height:1.85}
.hl .ico{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(140deg,rgba(94,234,212,.16),rgba(167,139,250,.16));
  border:1px solid rgba(94,234,212,.22);
}
.hl .ico svg{width:18px;height:18px;stroke:var(--c1);fill:none;stroke-width:1.7}

/* ============ timeline ============ */
.timeline{position:relative;padding-left:34px}
.timeline::before{
  content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1px;
  background:linear-gradient(180deg,transparent,var(--c1) 8%,var(--c4) 45%,var(--c2) 78%,transparent);
  opacity:.5;
}
.tl-item{position:relative;margin-bottom:22px}
.tl-item:last-child{margin-bottom:0}
.tl-item::before{
  content:"";position:absolute;left:-30px;top:30px;width:9px;height:9px;border-radius:50%;
  background:var(--bg);border:2px solid var(--c1);box-shadow:0 0 0 4px rgba(94,234,212,.1),0 0 16px rgba(94,234,212,.55);
  transition:.4s;
}
.tl-item:hover::before{background:var(--c1);box-shadow:0 0 0 6px rgba(94,234,212,.14),0 0 24px rgba(94,234,212,.85)}
.tl-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
.tl-title{font-size:1.06rem;font-weight:700;letter-spacing:.01em}
.tl-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:9px;font-size:.78rem;color:var(--dim)}
.tl-role{color:var(--c2);border:1px solid rgba(167,139,250,.26);background:rgba(167,139,250,.07);padding:2px 10px;border-radius:999px}
.tl-date{font-family:ui-monospace,Consolas,monospace;letter-spacing:.04em;color:var(--c1)}
.tl-list{list-style:none;margin:16px 0 0;display:flex;flex-direction:column;gap:10px}
.tl-list li{position:relative;padding-left:20px;font-size:.885rem;color:var(--mut);line-height:1.85}
.tl-list li::before{
  content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:1px;
  background:linear-gradient(135deg,var(--c1),var(--c4));transform:rotate(45deg);opacity:.85;
}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tag{
  font-family:ui-monospace,Consolas,monospace;font-size:.71rem;letter-spacing:.02em;
  padding:4px 11px;border-radius:6px;color:var(--c4);
  border:1px solid rgba(96,165,250,.22);background:rgba(96,165,250,.07);
  transition:.28s;
}
.tag:hover{color:#fff;border-color:rgba(96,165,250,.6);background:rgba(96,165,250,.18);transform:translateY(-2px)}

/* ============ publications ============ */
.pub{display:flex;gap:18px;align-items:flex-start}
.pub .badge-col{flex:none}
.pub-kind{
  font-family:ui-monospace,Consolas,monospace;font-size:.64rem;letter-spacing:.16em;
  padding:4px 9px;border-radius:5px;white-space:nowrap;
}
.k-journal{color:var(--c1);background:rgba(94,234,212,.1);border:1px solid rgba(94,234,212,.28)}
.k-conf{color:var(--c5);background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.26)}
.k-award{color:var(--c3);background:rgba(244,114,182,.09);border:1px solid rgba(244,114,182,.26)}
.pub-body{flex:1;min-width:0}
.pub-text{font-size:.9rem;line-height:1.8;color:var(--tx)}
.pub-text em{font-style:normal;color:var(--c1);font-weight:600}
.pub-sub{font-size:.79rem;color:var(--dim);margin-top:9px}
.pub-note{
  display:inline-block;margin-top:12px;font-size:.72rem;letter-spacing:.03em;
  padding:4px 11px;border-radius:999px;color:var(--c2);
  border:1px solid rgba(167,139,250,.28);background:rgba(167,139,250,.07);
}

/* ============ skills ============ */
.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}
.skill-block h3{
  font-size:.82rem;font-weight:650;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin-bottom:18px;display:flex;align-items:center;gap:9px;
}
.skill-block h3::before{content:"";width:4px;height:14px;border-radius:2px;background:linear-gradient(var(--c1),var(--c2))}
.bars{display:flex;flex-direction:column;gap:15px}
#barCard{display:flex;flex-direction:column;justify-content:center}
.bar-row{display:grid;grid-template-columns:118px 1fr 40px;gap:12px;align-items:center}
.bar-name{font-size:.82rem;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{display:block;height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
html[data-theme="light"] .bar-track{background:rgba(10,20,40,.08)}
.bar-fill{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--c1),var(--c4) 60%,var(--c2));
  box-shadow:0 0 14px rgba(94,234,212,.42);
  transition:width 1.15s cubic-bezier(.2,.8,.2,1);
}
.bar-val{font-family:ui-monospace,Consolas,monospace;font-size:.72rem;color:var(--dim);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font-size:.79rem;padding:7px 14px;border-radius:9px;
  border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--mut);
  transition:.28s;cursor:default;
}
html[data-theme="light"] .chip{background:rgba(255,255,255,.8)}
.chip:hover{color:var(--tx);border-color:rgba(167,139,250,.42);background:rgba(167,139,250,.1);transform:translateY(-2px)}
.skill-col{display:flex;flex-direction:column;gap:18px}
.lang-row{display:flex;justify-content:space-between;gap:12px;font-size:.86rem;color:var(--mut);padding:9px 0;border-bottom:1px dashed var(--line)}
.lang-row:last-child{border-bottom:0}
.lang-row b{color:var(--tx);font-weight:600}
.lang-row span{font-family:ui-monospace,Consolas,monospace;font-size:.76rem;color:var(--c1)}

/* ============ footer ============ */
footer{position:relative;z-index:2;padding:80px 0 54px;border-top:1px solid var(--line);margin-top:40px;overflow:hidden}
.cta{text-align:center;max-width:620px;margin:0 auto}
.cta h2{font-size:clamp(1.7rem,4vw,2.6rem);font-weight:800;letter-spacing:-.01em;line-height:1.25;margin-bottom:16px}
.cta h2 .grad{background:linear-gradient(100deg,var(--c1),var(--c4),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.cta p{color:var(--mut);font-size:.92rem;margin-bottom:30px}
.cta-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.foot-bottom{
  margin-top:64px;padding-top:26px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  font-size:.74rem;color:var(--dim);font-family:ui-monospace,Consolas,monospace;letter-spacing:.06em;
}

/* ============ reveal ============ */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .75s cubic-bezier(.2,.7,.2,1),transform .75s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

/* ============ responsive ============ */
@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr;gap:44px;text-align:left}
  .avatar-wrap{order:-1;width:min(220px,52vw);justify-self:start}
  .grid-3{grid-template-columns:1fr}
  .grid-2{grid-template-columns:1fr}
  .skill-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  section{padding:58px 0}
  .wrap{padding:0 20px}
}
@media (max-width:560px){
  .hero{padding-top:104px}
  .sec-title{white-space:normal;font-size:1.3rem;line-height:1.35}
  .sec-line{display:none}
  .tl-list li,.hl p,.pub-text{overflow-wrap:break-word}
  .tl-top{flex-direction:column;align-items:flex-start;gap:6px}
  .bar-row{grid-template-columns:96px 1fr 34px;gap:9px}
  .pub{flex-direction:column;gap:12px}
}

/* ============ reduced motion ============ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .reveal{opacity:1;transform:none}
  html{scroll-behavior:auto}
}

/* ============ print ============ */
@media print{
  @page{size:A4;margin:14mm 12mm}
  #bg,.noise,.blob,.cursor-glow,.nav,.progress,.scroll-hint,.hero-actions,.cta-actions{display:none!important}
  :root{--bg:#fff;--tx:#0f1420;--mut:#3c4354;--dim:#5f6676;--line:#d9dde6;--glass:#fff;--glass-2:#fff}
  html,body{background:#fff!important;color:#0f1420!important}
  body{font-size:10.5pt;line-height:1.55}
  .hero{min-height:auto;padding:0 0 16pt}
  .hero .wrap{grid-template-columns:1fr 92px;gap:16pt;align-items:start}
  .avatar-wrap{width:92px;animation:none;justify-self:end;margin-top:2pt}
  .avatar-ring{inset:-5px}
  .avatar-wrap::after{display:none}
  .orb{display:none}
  .pinyin,.typing,.scroll-hint{display:none!important}
  .hero-pills{margin-top:8pt;gap:5pt}
  .pill{font-size:8pt;padding:3pt 8pt;background:#fff!important;border-color:#d9dde6!important;color:#333!important}
  .hero h1{font-size:26pt;margin:6pt 0 2pt}
  .stats{margin-top:0}
  .stat{padding:9pt 6pt}
  .stat b{font-size:17pt}
  .card{break-inside:avoid}
  .hero h1 .grad{color:#0f1420!important;-webkit-text-fill-color:#0f1420;background:none}
  .kicker{color:#0b7a6b}
  section{padding:14pt 0;break-inside:avoid}
  .wrap{max-width:none;padding:0}
  .sec-head{margin-bottom:10pt}
  .sec-num,.sec-title{color:#0f1420}
  .card{box-shadow:none!important;background:#fff!important;border-color:#d9dde6!important;padding:12pt 14pt;transform:none!important}
  .card::before{display:none}
  .timeline{padding-left:20pt}
  .tl-item{margin-bottom:10pt;break-inside:avoid}
  .tl-list li{font-size:9.5pt;line-height:1.5}
  .tag,.chip,.pill,.pub-note,.edu .deg{border-color:#cfd5e0!important;color:#333!important;background:#f5f6f9!important}
  .stat b{color:#0b7a6b!important;-webkit-text-fill-color:#0b7a6b;background:none}
  .stat{background:#fff!important}
  .bar-fill{background:#0b7a6b!important;box-shadow:none!important}
  a{text-decoration:none;color:inherit}
  footer{padding-top:10pt;margin-top:8pt}
  .foot-bottom{margin-top:14pt}
}

/* ============================================================
   TYPING
   ============================================================ */
let typingTimer = null;
function startTyping() {
  const el = $('#typed');
  const phrases = DATA.typed[lang];
  let pi = 0, ci = 0, del = false;
  clearTimeout(typingTimer);
  el.textContent = '';
  (function step() {
    const word = phrases[pi];
    if (!del) {
      ci++;
      el.textContent = word.slice(0, ci);
      if (ci === word.length) { del = true; typingTimer = setTimeout(step, 1750); return; }
      typingTimer = setTimeout(step, 62);
    } else {
      ci--;
      el.textContent = word.slice(0, ci);
      if (ci === 0) { del = false; pi = (pi + 1) % phrases.length; typingTimer = setTimeout(step, 320); return; }
      typingTimer = setTimeout(step, 26);
    }
  })();
}

/* ============================================================
   REVEAL + COUNTERS
   ============================================================ */
let io = null;
function observeReveals() {
  if (io) io.disconnect();
  io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.add('in');
      io.unobserve(e.target);
      // bars
      $$('.bar-fill', e.target).forEach((b, i) => {
        setTimeout(() => { b.style.width = b.dataset.v + '%'; }, 160 + i * 110);
      });
      // counters
      $$('[data-count]', e.target).forEach(el => countUp(el));
    });
  }, { threshold: 0.16, rootMargin: '0px 0px -8% 0px' });

  $$('.reveal').forEach(el => {
    if (el.classList.contains('in')) {
      // ensure bars/counters already visible still fire
      $$('.bar-fill', el).forEach(b => { if (!b.style.width) b.style.width = b.dataset.v + '%'; });
      return;
    }
    io.observe(el);
  });
}

function countUp(el) {
  const target = +el.dataset.count;
  if (el.dataset.done) return;
  el.dataset.done = '1';
  const dur = 1100, t0 = performance.now();
  (function tick(now) {
    const p = Math.min((now - t0) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * eased);
    if (p < 1) requestAnimationFrame(tick);
    else el.textContent = target;
  })(t0);
}

/* ============================================================
   CARD SPOTLIGHT
   ============================================================ */
function attachCardGlow() {
  $$('.card').forEach(card => {
    if (card.dataset.glow) return;
    card.dataset.glow = '1';
    card.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });
}

/* ============================================================
   BACKGROUND PARTICLE FIELD
   ============================================================ */
(function background() {
  const cv = $('#bg');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, dpr, parts = [], mouse = { x: -9999, y: -9999 };
  const PALETTE = ['94,234,212', '96,165,250', '167,139,250', '244,114,182', '251,191,36'];

  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.min(170, Math.round((w * h) / 13000));
    parts = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - .5) * .22,
      vy: (Math.random() - .5) * .22,
      r: Math.random() * 1.9 + .5,
      c: PALETTE[(Math.random() * PALETTE.length) | 0],
      a: Math.random() * .45 + .25
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    // links
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      for (let j = i + 1; j < parts.length; j++) {
        const q = parts[j];
        const dx = p.x - q.x, dy = p.y - q.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 12100) {
          const alpha = (1 - d2 / 12100) * .10;
          ctx.strokeStyle = `rgba(120,180,220,${alpha})`;
          ctx.lineWidth = .6;
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
        }
      }
    }
    // dots
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < -10) p.x = w + 10; if (p.x > w + 10) p.x = -10;
      if (p.y < -10) p.y = h + 10; if (p.y > h + 10) p.y = -10;

      // gentle mouse repulsion
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 26000) {
        const f = (1 - d2 / 26000) * .55;
        p.x += (dx / (Math.sqrt(d2) + 1)) * f;
        p.y += (dy / (Math.sqrt(d2) + 1)) * f;
      }

      ctx.beginPath();
      ctx.fillStyle = `rgba(${p.c},${p.a})`;
      ctx.shadowBlur = 12;
      ctx.shadowColor = `rgba(${p.c},${p.a * .8})`;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    raf = requestAnimationFrame(draw);
  }

  let raf = null;
  size();
  if (reduce) {
    draw(); cancelAnimationFrame(raf);
  } else {
    draw();
  }
  addEventListener('resize', () => { size(); }, { passive: true });
  addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
  addEventListener('pointerleave', () => { mouse.x = -9999; mouse.y = -9999; });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(raf); raf = null; }
    else if (!raf && !reduce) raf = requestAnimationFrame(draw);
  });
})();

/* ============================================================
   SCROLL / NAV
   ============================================================ */
(function scrollUI() {
  const bar = $('#bar');
  const nav = $('#nav');
  let lastY = 0;
  const secs = ['education', 'highlights', 'research', 'pub', 'skills'];
  const links = $$('.nav a[data-sec]');

  function onScroll() {
    const st = scrollY;
    const docH = document.documentElement.scrollHeight - innerHeight;
    bar.style.width = (docH > 0 ? (st / docH) * 100 : 0) + '%';

    if (st > lastY && st > 460) nav.classList.add('hide');
    else nav.classList.remove('hide');
    lastY = st;

    let cur = '';
    for (const id of secs) {
      const el = document.getElementById(id);
      if (el && el.getBoundingClientRect().top <= innerHeight * 0.34) cur = id;
    }
    links.forEach(a => a.classList.toggle('on', a.dataset.sec === cur));
  }
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  addEventListener('pointermove', e => {
    const g = $('#cursorGlow');
    g.style.left = e.clientX + 'px';
    g.style.top = e.clientY + 'px';
  }, { passive: true });
})();
